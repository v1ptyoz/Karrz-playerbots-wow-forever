name: macOS build and release

# Builds the server on a real Mac (Apple Silicon), runs the unit tests and packs the ready-made download
# (macos/package.sh). A pushed tag v* also publishes it as a GitHub release; every other run keeps the
# download as a workflow artifact for 14 days.

on:
  push:
    branches: ['main', 'master', 'claude/**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'doc/**', 'v2/**', 'repack/**']
  workflow_dispatch:
    inputs:
      tests:
        description: 'Build and run the unit tests'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      WOWF_HOME: ${{ github.workspace }}/../wowf
      CCACHE_DIR: ${{ github.workspace }}/../ccache
      CCACHE_MAXSIZE: 6G
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_COMPILERCHECK: content
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      MACOSX_DEPLOYMENT_TARGET: '14.0'

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Version
      id: v
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="dev-$(git rev-parse --short HEAD)"; fi
        echo "version=$v" >> "$GITHUB_OUTPUT"
        echo "Version $v, $(sysctl -n hw.ncpu) cores, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB, macOS $(sw_vers -productVersion)"

    - name: Compiler cache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/../ccache
        key: ccache-macos15-${{ hashFiles('macos/UPSTREAM') }}-${{ github.sha }}
        restore-keys: |
          ccache-macos15-${{ hashFiles('macos/UPSTREAM') }}-
          ccache-macos15-

    - name: Build (macos/build.sh)
      run: |
        tests=""
        if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.tests }}" = "true" ]; then tests="--tests"; fi
        macos/build.sh --from-source --jobs 3 $tests
        ccache -s || true

    - name: Smoke test
      run: |
        "$WOWF_HOME/server/bin/worldserver" --version
        "$WOWF_HOME/server/bin/bnetserver" --version
        ls "$WOWF_HOME/server/etc/worldserver.conf.d"

    - name: Package (macos/package.sh)
      run: macos/package.sh --version "${{ steps.v.outputs.version }}" --out dist --repo "${{ github.repository }}"

    - name: Keep the download
      uses: actions/upload-artifact@v7
      with:
        name: WoW-Forever-Bots-macOS-arm64-${{ steps.v.outputs.version }}
        path: dist/*
        retention-days: 14

    - name: Publish the release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        notes=macos/RELEASE-NOTES.md
        gh release create "${GITHUB_REF_NAME}" dist/* --repo "${{ github.repository }}" \
          --title "WoW Forever Bots for macOS ${GITHUB_REF_NAME}" --notes-file "$notes" \
          || gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${{ github.repository }}" --clobber
